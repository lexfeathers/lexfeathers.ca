<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'>
    <filter id='noiseFilter'>
        <feTurbulence
            type='fractalNoise'
            baseFrequency='2.5'
            numOctaves='2'
            stitchTiles='stitch' />
        <feColorMatrix 
            type="matrix" 
            values="0.14 0 0 0 1
                    0 0.14 0 0 1 
                    0 0 0.14 0 1 
                    0 0 0 0.05 0"
            />
    </filter>

    <rect width='100%' height='100%' filter='url(#noiseFilter)' />
</svg>